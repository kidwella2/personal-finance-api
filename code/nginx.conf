worker_processes 1;
pid @RUNTIME_DIR@/nginx.pid;
error_log @RUNTIME_DIR@/nginx-error.log;

events {
    worker_connections 128;
}

http {
    include "@NGINX_DIR@/mime.types";
    default_type application/octet-stream;
    access_log @RUNTIME_DIR@/nginx-access.log;
    client_body_temp_path @RUNTIME_DIR@/client_temp;
    proxy_temp_path @RUNTIME_DIR@/proxy_temp;
    fastcgi_temp_path @RUNTIME_DIR@/fastcgi_temp;
    uwsgi_temp_path @RUNTIME_DIR@/uwsgi_temp;
    scgi_temp_path @RUNTIME_DIR@/scgi_temp;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root @RUNTIME_DIR@/api;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include "@NGINX_DIR@/fastcgi_params";
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:@RUNTIME_DIR@/php-fpm.sock;
        }
    }
}